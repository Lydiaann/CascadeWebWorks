<!DOCTYPE html> 

<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Contact | Cascade Web Works</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="description" context="Cascade Web Works - Where elevation meets innovation. Creating custom webpages for all of your needs!">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect">
  </head>
  <body>
    <div class="desktop-nav">  <!--Desktop size nav -->
      <div class="nav-links">
        <a href="index.html" class="desktop-nav-link">Home</a>
        <a href="about.html" class="desktop-nav-link">About</a>
        <a href="portfolio.html" class="desktop-nav-link">Portfolio</a>
        <a href="contact.html" class="desktop-nav-link">Contact</a>  
      </div>
      <a href="index.html" class="small-logo"><img src="images/smalllogo.png"></a>
    </div>
    <header>           
      <div class="hero-section">
        <h1 class="companyname">CONTACT</h1>
      </div>
    </header>
    <nav class="mobile-nav"> <!-- iphone size nav ---- 1080px -->
      <input type="checkbox" id="menu-toggle" />
      <label for="menu-toggle" class="hamburger">☰</label>
      <div class="mobile-nav-links">
        <a class="home" href="index.html" class="mobile-nav-link">Home</a>
        <a class="mobile-nav-link" href="about.html">About</a>
        <a class="mobile-nav-link" href="portfolio.html">Portfolio</a>
        <a class="mobile-nav-link" href="contact.html">Contact</a>
      </div>
    </nav>
    <main class="page-wrapper">
      <div class="contact-intro">
        <div class="linkedin">
          <a href="https://www.linkedin.com/in/lydiaastiles/">

          <img src="images/linkedin.jpg" class="contact-img" alt="LinkedIn Profile"></a>
          <a href="tel:+17018855885">
          <img src="images/phone.png" class="contact-img" alt="Call or Text Us"></a>
          <a href="mailto:lydia93stiles@gmail.com">
          <img src="images/email.webp" class="contact-img"alt="Email Us"></a>
        </div>
      </div>
      <div class="form-container"> 
        <h1 class="form-header">CONTACT FORM</h1>
        <form action="/contact" method="POST" enctype="multipart/form-data">

          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your name" required>
          <br>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required>
          <br>
          <label for="category">Category</label>
          <br>
          <select id="category" name="category">
            <option>General</option>
            <option>Website</option>
            <option>Quote</option>
          </select>
          <br>
          <label for="screenshot">Attach Image (optional)</label>
          <input id="screenshot" name="screenshot" type="file" accept="image/*">
          <br>
          <label for="message">Message</label>
          <br>
          <textarea id="message" name="message" placeholder="Include details..." required></textarea>

          <button type="submit" class="send-button">Send</button>
        </form>
      </div>
    </main>    
    <footer>
      Cascade Web Works | 2026
    </footer>
  </body>
</html>
